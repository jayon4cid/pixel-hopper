<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#0f380f">
<title>Pixel Hopper</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0f380f;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage { flex: 1; min-height: 0; display: flex; }
  canvas {
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
  }
  #controls {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px 16px;
  }
  button {
    width: 88px; height: 76px; border-radius: 18px;
    border: 3px solid #306230; background: rgba(48, 98, 48, .55);
    color: #9bbc0f; font: bold 28px monospace;
    touch-action: none;
  }
  button.on { background: rgba(155, 188, 15, .75); color: #0f380f; }
  @media (orientation: landscape) {
    body { flex-direction: row; }
    #controls { display: contents; }
    #left  { order: 1; padding-left: 12px; }
    #stage { order: 2; }
    #right { order: 3; padding-right: 12px; }
    button { width: 72px; height: 64px; font-size: 24px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="160" height="144"></canvas></div>
<div id="controls">
  <div id="left"><button data-b="left">◀</button></div>
  <div id="right"><button data-b="right">▶</button></div>
</div>

<script>
// ---------- Constants ----------
const W = 160, H = 144;
const HW = 10, HH = 12;         // hero size
const GRAVITY = 0.35;
const BOUNCE = -8.5;            // normal platform bounce
const SPRING = -14.0;           // spring boost
const MAX_FALL = 14;
const SPEED = 2.6;
const AIR_CONTROL = 0.9;
const PW = 26, PH = 4;
const START_Y = H - 24 - HH;
const PAL = ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'];

// Platform types
const P_NORMAL = 0, P_MOVING = 1, P_BREAK = 2, P_SPRING = 3;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- Input ----------
let touchHeld = { left: false, right: false };
const keyHeld = { left: false, right: false };
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right' };

function readTouches(e) {
  const h = { left: false, right: false };
  for (const t of e.touches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const btn = el && el.closest && el.closest('[data-b]');
    if (btn) h[btn.dataset.b] = true;
  }
  touchHeld = h;
}

['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(type => {
  document.addEventListener(type, e => {
    e.preventDefault();
    readTouches(e);
    unlockAudio();
    if (state !== 'play') reset();
  }, { passive: false });
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = KEYS[e.code];
  if (k) { keyHeld[k] = true; e.preventDefault(); }
  unlockAudio();
  if (state !== 'play') reset();
});
window.addEventListener('keyup', e => {
  const k = KEYS[e.code];
  if (k) keyHeld[k] = false;
});

// ---------- Audio ----------
let actx = null;
function unlockAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type='square', vol=0.04) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g).connect(actx.destination);
  o.start();
  o.stop(actx.currentTime + dur);
}

// ---------- Game state ----------
let state = 'title';
let hx, hy, vy, cam, plats, topY, score, best = 0;
let squash = 0;

function makePlatform(y, x) {
  const r = Math.random();
  let type = P_NORMAL;
  if (r < 0.10) type = P_MOVING;
  else if (r < 0.20) type = P_BREAK;
  else if (r < 0.25) type = P_SPRING;

  const p = {
    x: x !== undefined ? x : Math.random() * (W - PW),
    y,
    w: PW,
    type,
    dead: false,
    dir: Math.random() < 0.5 ? -1 : 1,
    speed: 0.6 + Math.random() * 0.8,
  };
  return p;
}

function reset() {
  plats = [makePlatform(H - 24, W / 2 - PW / 2)];
  plats[0].type = P_NORMAL;
  topY = H - 24;
  hx = W / 2 - HW / 2;
  hy = START_Y;
  vy = BOUNCE;
  cam = 0;
  score = 0;
  squash = 0;
  state = 'play';
  while (topY > cam - 40) addPlatform();
}

function addPlatform() {
  const gap = 26 + Math.random() * 22;
  topY -= gap;
  plats.push(makePlatform(topY));
}

function update() {
  const left  = touchHeld.left  || keyHeld.left;
  const right = touchHeld.right || keyHeld.right;

  // Horizontal control
  let vx = 0;
  if (left)  vx -= SPEED;
  if (right) vx += SPEED;
  if (vy > 0) vx *= AIR_CONTROL;
  hx += vx;
  if (hx + HW < 0) hx = W;
  if (hx > W) hx = -HW;

  // Move moving platforms
  for (const p of plats) {
    if (p.type === P_MOVING && !p.dead) {
      p.x += p.dir * p.speed;
      if (p.x < 0) { p.x = 0; p.dir = 1; }
      if (p.x + p.w > W) { p.x = W - p.w; p.dir = -1; }
    }
  }

  // Vertical physics
  const prevBottom = hy + HH;
  vy = Math.min(vy + GRAVITY, MAX_FALL);
  hy += vy;

  // Landing check — only when falling
  if (vy > 0) {
    for (const p of plats) {
      if (p.dead) continue;
      if (hx + HW > p.x + 2 && hx + 2 < p.x + p.w &&
          prevBottom <= p.y + 1 && hy + HH >= p.y) {
        hy = p.y - HH;
        if (p.type === P_SPRING) {
          vy = SPRING;
          beep(880, 0.09, 'square', 0.05);
        } else {
          vy = BOUNCE;
          beep(660, 0.05);
        }
        squash = 1;
        if (p.type === P_BREAK) {
          p.dead = true;
          beep(220, 0.08, 'sawtooth', 0.05);
        }
        break;
      }
    }
  }

  // Camera
  const target = hy - H * 0.5;
  if (target < cam) cam = target;

  // Recycle platforms
  while (topY > cam - 40) addPlatform();
  plats = plats.filter(p => !p.dead && p.y < cam + H + 40);

  // Score = highest reached
  const reached = Math.max(0, Math.floor((START_Y - hy) / 4));
  if (reached > score) score = reached;

  // Squash decay
  if (squash > 0) squash = Math.max(0, squash - 0.1);

  // Fell off bottom
  if (hy - cam > H + HH) {
    state = 'over';
    best = Math.max(best, score);
    beep(150, 0.3, 'triangle', 0.06);
  }
}

function drawPlatform(p) {
  const sy = p.y - cam;
  if (sy < -PH * 3 || sy > H + 10) return;
  if (p.type === P_MOVING) {
    ctx.fillStyle = '#8bac0f';
    ctx.fillRect(p.x, sy, p.w, PH);
    ctx.fillStyle = '#0f380f';
    ctx.fillRect(p.x, sy, p.w, 1);
    ctx.fillRect(p.x + p.w - 3, sy + 1, 2, 2);
    ctx.fillRect(p.x + 1, sy + 1, 2, 2);
  } else if (p.type === P_BREAK) {
    ctx.fillStyle = '#306230';
    ctx.fillRect(p.x, sy, p.w, PH);
    ctx.fillStyle = '#0f380f';
    for (let i = 2; i < p.w - 2; i += 6) ctx.fillRect(p.x + i, sy + 1, 3, 1);
  } else if (p.type === P_SPRING) {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(p.x, sy, p.w, PH);
    // spring coil
    ctx.fillStyle = '#0f380f';
    ctx.fillRect(p.x + p.w / 2 - 3, sy - 3, 6, 3);
    ctx.fillRect(p.x + p.w / 2 - 3, sy - 1, 6, 1);
  } else {
    ctx.fillStyle = '#306230';
    ctx.fillRect(p.x, sy, p.w, PH);
    ctx.fillStyle = '#8bac0f';
    ctx.fillRect(p.x, sy, p.w, 1);
  }
}

function draw() {
  ctx.fillStyle = PAL[0];
  ctx.fillRect(0, 0, W, H);

  for (const p of plats) drawPlatform(p);

  // Hero with squash/stretch
  if (state !== 'title') {
    const sy = hy - cam;
    const sxw = HW * (1 + squash * 0.35);
    const sxh = HH * (1 - squash * 0.35);
    const ox = (HW - sxw) / 2;
    const oy = HH - sxh;
    ctx.fillStyle = PAL[3];
    ctx.fillRect(hx + ox, sy + oy, sxw, sxh);
    // eyes
    ctx.fillStyle = PAL[0];
    const eyeY = sy + oy + 2;
    ctx.fillRect(hx + ox + 2, eyeY, 2, 2);
    ctx.fillRect(hx + ox + sxw - 4, eyeY, 2, 2);
  }

  if (state === 'play') {
    ctx.fillStyle = PAL[3];
    ctx.font = '8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(score + 'm', 4, 10);
  }

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(15, 56, 15, .7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PAL[0];
    ctx.textAlign = 'center';
    if (state === 'title') {
      ctx.font = 'bold 12px monospace';
      ctx.fillText('PIXEL HOPPER', W / 2, 60);
      ctx.font = '8px monospace';
      ctx.fillText('TAP TO START', W / 2, 84);
      ctx.fillText('< > TO STEER', W / 2, 104);
    } else {
      ctx.font = 'bold 12px monospace';
      ctx.fillText('GAME OVER', W / 2, 56);
      ctx.font = '8px monospace';
      ctx.fillText('SCORE ' + score + 'm', W / 2, 78);
      ctx.fillText('BEST ' + best + 'm', W / 2, 92);
      ctx.fillText('TAP TO RETRY', W / 2, 116);
    }
  }

  document.querySelectorAll('[data-b]').forEach(b => {
    const k = b.dataset.b;
    b.classList.toggle('on', !!(touchHeld[k] || keyHeld[k]));
  });
}

// ---------- Loop ----------
const STEP = 1000 / 60;
let last = 0, acc = 0;

function frame(t) {
  if (!last) last = t;
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= STEP) {
    if (state === 'play') update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}

async function keepAwake() {
  try { await navigator.wakeLock?.request('screen'); } catch (_) {}
}

requestAnimationFrame(frame);
keepAwake();
</script>
</body>
</html>
